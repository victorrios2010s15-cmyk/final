<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Comandos Estudiantil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <!-- Firebase App (Core) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<!-- Firebase Messaging (Notificaciones) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
<!-- Firebase Firestore (Base de datos) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <div class="logo">Liceo Control</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#evaluaciones">Evaluaciones</a></li>
            </ul>
        </nav>
    </header>

    <main id="evaluaciones">
        <section class="hero">
            <h1>Panel de Evaluaciones</h1>
            <p>Cronograma dinámico sincronizado para la sección</p>
        </section>

        <div class="alert-banner" id="global-alert">
            <div class="alert-icon"></div>
            <div class="alert-text" id="global-alert-text"></div>
        </div>

        <div class="timeline-container" id="timeline"></div>
    </main>

    <!-- SDKs de Firebase (Versión compatible con etiquetas script normales) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

<script>
  // Tu configuración de Firebase
  const firebaseConfig = {
  apiKey: "AIzaSyChlYEGHuaYmaTWxOHYSHsu51zFR9aJR0Q",
  authDomain: "apptarea-585ea.firebaseapp.com",
  projectId: "apptarea-585ea",
  storageBucket: "apptarea-585ea.firebasestorage.app",
  messagingSenderId: "813307226513",
  appId: "1:813307226513:web:907a996cb3226404191230"
};

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);
  const messaging = firebase.messaging();

  // Pedir permisos y registrar Service Worker al cargar la página
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/final/firebase-messaging-sw.js')
      .then((registration) => {
        console.log("Service Worker registrado con éxito:", registration);

        // Solicitar permiso de notificaciones
        Notification.requestPermission().then((permission) => {
          if (permission === 'granted') {
            messaging.getToken({
              vapidKey: 'BK-dzHKqZUPt0Mgc1eyqzhrbF6ib78_gfLTvDGGz6QjYwVgtAV7qXUFcfaFKN-yyNDfNklvja7TOP5VeHbZz_rs',
              serviceWorkerRegistration: registration
            }).then((currentToken) => {
              if (currentToken) {
                console.log("TOKEN DE ESTE DISPOSITIVO:", currentToken);
                // Aquí puedes guardar el token si lo deseas
              } else {
                console.log('No se pudo obtener el token de registro.');
              }
            }).catch((err) => {
              console.log('Ocurrió un error al obtener el token: ', err);
            });
          } else {
            console.log('Permiso de notificación denegado.');
          }
        });
      })
      .catch((err) => {
        console.log('Fallo el registro del Service Worker: ', err);
      });
  }
</script>
    <script src="app.js"></script>
</body>
</html>
